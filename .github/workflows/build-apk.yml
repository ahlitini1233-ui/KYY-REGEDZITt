name: Build KYY REGEDZIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip KYY_REGEDZIT_GitHub_Build_Ready.zip -d source

      - name: Build APK
        working-directory: source/KYY_REGEDZIT_Native_Project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KYY-REGEDZIT-APK
          path: source/KYY_REGEDZIT_Native_Project/app/build/outputs/apk/debug/app-debug.apk
